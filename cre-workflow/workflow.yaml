# Chainlink CRE workflow
# Reads Arc vault positions and official USYC, then the Untouched spend ledger,
# and repays used yield when surplus covers it.

name: untouched-yield-reconciliation
version: 1.0.0

triggers:
  - type: cron
    schedule: "0 */6 * * *"

env:
  ARC_TESTNET_RPC: "https://rpc.testnet.arc.network"
  ARC_RPC_FALLBACK: "https://rpc.solidrpc.io/public/evm/5042002"
  VAULT_ADDRESS: "0xcA9F8D931b6a0dE64ED74757A66aCB203413f2C1"
  USYC_ADDRESS: "0xe9185f0c5f296ed1797aae4238d26ccabeadb86c"
  LEDGER_URL: "http://127.0.0.1:3000/api/v1/ledger"

sources:
  - name: vault-positions
    type: evm-read
    config:
      chainId: 5042002
      rpc: "${ARC_TESTNET_RPC}"
      address: "${VAULT_ADDRESS}"
      method: "depositorCount()"

  - name: usyc-balance
    type: evm-read
    config:
      chainId: 5042002
      rpc: "${ARC_TESTNET_RPC}"
      address: "${USYC_ADDRESS}"
      method: "balanceOf(address)"
      args: ["${VAULT_ADDRESS}"]

  - name: gateway-ledger
    type: http
    config:
      url: "${LEDGER_URL}"
      method: GET

consensus:
  type: chainlink-ocr
  participants: 4
  threshold: 3

actions:
  - name: reconcile
    type: evm-write
    condition: "gateway-ledger.usedCredit > 0 && usyc-balance > 0"
    config:
      chainId: 5042002
      address: "${VAULT_ADDRESS}"
      method: "reconcile(address,uint256)"
